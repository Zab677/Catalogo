<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de Accesorios de Red</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #1a1f2e;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --accent3: #7c3aed;
    --text: #e2e8f0;
    --muted: #64748b;
    --border: #1e2a3a;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 3rem 2rem 2rem;
    text-align: center;
    position: relative;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0d1520 0%, var(--bg) 100%);
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 600px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent3), transparent);
  }

  .badge {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 3px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 1rem;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.75rem;
  }

  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 400;
    max-width: 600px;
    margin: 0 auto;
  }

  /* FILTERS */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 1.5rem 2rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 1px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

  .search-box {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--surface2);
    color: var(--text);
    outline: none;
    width: 220px;
    transition: border-color 0.2s;
  }

  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1.5rem;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 32px rgba(0,229,255,0.08);
  }

  .card-header {
    padding: 1.2rem 1.4rem 0.8rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .icon {
    font-size: 2rem;
    flex-shrink: 0;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2);
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .card-title-group { flex: 1; }

  .card-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 2px;
  }

  .card-name {
    font-size: 1.05rem;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
  }

  .card-type {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 3px;
  }

  .env-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .env-tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .tag-hogar { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
  .tag-pyme  { background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }
  .tag-empresa { background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }

  /* BODY */
  .card-body {
    padding: 1rem 1.4rem;
  }

  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
    margin-top: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-label::before {
    content: '';
    display: inline-block;
    width: 16px; height: 1px;
    background: var(--accent);
  }

  .section-label:first-child { margin-top: 0; }

  .specs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
    margin-top: 4px;
  }

  .spec-item {
    font-size: 0.8rem;
    color: var(--muted);
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
  }

  .spec-key { color: var(--text); font-weight: 600; white-space: nowrap; }

  .pros-cons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }

  .pros, .cons {
    padding: 8px;
    border-radius: 4px;
  }

  .pros { background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.2); }
  .cons { background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2); }

  .pros-title { color: var(--green); font-size: 0.7rem; font-weight: 700; margin-bottom: 4px; font-family: 'Space Mono', monospace; }
  .cons-title { color: var(--red); font-size: 0.7rem; font-weight: 700; margin-bottom: 4px; font-family: 'Space Mono', monospace; }

  .pc-list { list-style: none; padding: 0; }
  .pc-list li { font-size: 0.78rem; color: var(--muted); padding: 1px 0; padding-left: 10px; position: relative; }
  .pc-list li::before { content: '▸'; position: absolute; left: 0; font-size: 0.65rem; }
  .pros .pc-list li::before { color: var(--green); }
  .cons .pc-list li::before { color: var(--red); }

  .cost-bar {
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cost-label { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: #fff; font-weight: 700; }
  .cost-range {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent2);
    padding: 3px 10px;
    background: rgba(255,107,53,0.1);
    border: 1px solid rgba(255,107,53,0.3);
    border-radius: 3px;
  }

  .info-text {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.5;
    margin-top: 4px;
  }

  /* STATS BAR */
  .stats-row {
    display: flex;
    gap: 1rem;
    padding: 1rem 2rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat { text-align: center; }
  .stat-num { font-family: 'Space Mono', monospace; font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 0.7rem; color: var(--muted); letter-spacing: 1px; }

  .no-results {
    text-align: center;
    padding: 4rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    grid-column: 1/-1;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; padding: 1rem; }
    .specs-grid { grid-template-columns: 1fr; }
    .pros-cons { grid-template-columns: 1fr; }
  }
</style>
</head>

<header>

let activeFilter = 'all';
let searchTerm = '';

function renderCards() {
  const grid = document.getElementById('grid');
  const filtered = devices.filter(d => {
    const matchCat = activeFilter === 'all' || d.cat === activeFilter;
    const matchSearch = !searchTerm ||
      d.name.toLowerCase().includes(searchTerm) ||
      d.type.toLowerCase().includes(searchTerm) ||
      d.uso.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">⚠ No se encontraron dispositivos con ese filtro.</div>';
    return;
  }

  grid.innerHTML = filtered.map(d => `
    <div class="card">
      <div class="card-header">
        <div class="icon">${d.icon}</div>
        <div class="card-title-group">
          <div class="card-num">DISPOSITIVO #${String(d.id).padStart(2,'0')}</div>
          <div class="card-name">${d.name}</div>
          <div class="card-type">${d.type}</div>
          <div class="env-tags">
            ${d.env.includes('hogar') ? '<span class="env-tag tag-hogar">Hogar</span>' : ''}
            ${d.env.includes('pyme')  ? '<span class="env-tag tag-pyme">PyME</span>'  : ''}
            ${d.env.includes('empresa') ? '<span class="env-tag tag-empresa">Empresa</span>' : ''}
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="section-label">Especificaciones técnicas</div>
        <div class="specs-grid">
          ${d.specs.map(s => `<div class="spec-item"><span class="spec-key">${s.k}:</span><span>${s.v}</span></div>`).join('')}
        </div>

        <div class="section-label">Uso recomendado</div>
        <div class="info-text">${d.uso}</div>

        <div class="section-label">Ventajas y desventajas</div>
        <div class="pros-cons">
          <div class="pros">
            <div class="pros-title">✔ VENTAJAS</div>
            <ul class="pc-list">${d.pros.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
          <div class="cons">
            <div class="cons-title">✘ DESVENTAJAS</div>
            <ul class="pc-list">${d.cons.map(c => `<li>${c}</li>`).join('')}</ul>
          </div>
        </div>

        <div class="section-label">Costo orientativo</div>
        <div class="cost-bar">
          <span class="cost-label">💵</span>
          <span class="cost-range">${d.costo}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function filter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function search() {
  searchTerm = document.getElementById('searchBox').value.toLowerCase();
  renderCards();
}

renderCards();
</script>
